stroykroy_shop.import:
  path: '/admin/commerce/stroykroy-import'
  defaults:
    _form: '\Drupal\stroykroy_shop\Form\CatalogImportForm'
    _title: 'Импорт каталога лекал из студии'
  requirements:
    _permission: 'import stroykroy catalog'

stroykroy_shop.catalog:
  path: '/catalog'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\CatalogController::page'
    _title: 'Каталог лекал'
  requirements:
    _permission: 'access content'

stroykroy_shop.catalog_category:
  path: '/catalog/{category}'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\CatalogController::page'
    _title: 'Каталог лекал'
  requirements:
    _permission: 'access content'
    category: '[a-z0-9-]+'

stroykroy_shop.catalog_section:
  path: '/sk-group/{section}'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\CatalogController::page'
    _title: 'Каталог лекал'
  requirements:
    _permission: 'access content'
    section: '[a-z0-9-]+'

stroykroy_shop.catalog_both:
  path: '/sk-group/{section}/{category}'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\CatalogController::page'
    _title: 'Каталог лекал'
  requirements:
    _permission: 'access content'
    section: '[a-z0-9-]+'
    category: '[a-z0-9-]+'

stroykroy_shop.error_report:
  path: '/stroykroy/error-report'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\ErrorReportController::receive'
  methods: [POST]
  requirements:
    _access: 'TRUE'

stroykroy_shop.order_files:
  path: '/stroykroy/order/{commerce_order}'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\DownloadController::page'
  options:
    parameters:
      commerce_order:
        type: entity:commerce_order
  requirements:
    _access: 'TRUE'

stroykroy_shop.download:
  path: '/stroykroy/download/{commerce_order}/{item}/{kind}'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\DownloadController::download'
  options:
    parameters:
      commerce_order:
        type: entity:commerce_order
  requirements:
    _access: 'TRUE'

stroykroy_shop.rebuild:
  path: '/stroykroy/rebuild/{commerce_order}'
  defaults:
    _controller: '\Drupal\stroykroy_shop\Controller\DownloadController::rebuild'
  options:
    parameters:
      commerce_order:
        type: entity:commerce_order
  requirements:
    _permission: 'administer commerce_order'
